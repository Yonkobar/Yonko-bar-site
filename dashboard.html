<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal des réservations — Yonko Bar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink:#14171c;
    --paper:#f5efdf; --paper-2:#ece2c8; --rule:#d6c79a;
    --brass:#ff6e00; --brass-soft:#fdead2;
    --ok:#3f8f74; --ok-soft:#e3efe7;
    --warn:#b9821f; --warn-soft:#f6ecd6;
    --danger:#a6432f; --danger-soft:#f5e4df;
    --text:#241f14; --muted:#8a7d5c;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { background:var(--ink); color:var(--text); font-family:'Inter',system-ui,sans-serif; margin:0; }

  .masthead {
    background:var(--ink);
    padding:18px 20px;
    display:flex; align-items:center; gap:13px;
    border-bottom:3px solid var(--brass);
  }
  .masthead img { width:32px; height:32px; object-fit:contain; flex-shrink:0; }
  .masthead h1 { font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--paper); margin:0; }
  .masthead .sub { color:rgba(245,239,223,.5); font-size:12px; margin:1px 0 0; font-family:'Fraunces',serif; font-style:italic; }

  .ledger { background:var(--paper); min-height:calc(100vh - 72px); }
  .ledger-inner { max-width:640px; margin:0 auto; padding:20px 18px 60px; }

  .stats { display:flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden; margin-bottom:18px; }
  .stat { flex:1; text-align:center; padding:10px 6px; cursor:pointer; border-right:1px solid var(--rule); background:var(--paper); }
  .stat:last-child { border-right:none; }
  .stat .n { font-family:'Fraunces',serif; font-size:21px; font-weight:600; display:block; }
  .stat .l { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .stat.pending .n { color:var(--warn); }
  .stat.accepted .n { color:var(--ok); }
  .stat.declined .n { color:var(--danger); }

  .search { position:relative; margin-bottom:16px; }
  .search input {
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--rule);
    border-radius:0; padding:8px 4px 8px 26px; font-size:14px; color:var(--text); font-family:inherit;
  }
  .search input:focus { outline:none; border-bottom-color:var(--brass); }
  .search svg { position:absolute; left:2px; top:50%; transform:translateY(-50%); color:var(--muted); }

  .viewtoggle { display:flex; gap:20px; margin-bottom:18px; border-bottom:1px solid var(--rule); }
  .viewtoggle button {
    background:none; border:none; padding:9px 0 10px; font-size:13.5px; font-weight:600;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
    font-family:'Inter',sans-serif; display:flex; align-items:center; gap:6px;
  }
  .viewtoggle button.active { color:var(--text); border-bottom-color:var(--brass); }

  .addbtn {
    width:100%; background:var(--brass); color:#1b1204; border:none; border-radius:3px;
    padding:12px; font-weight:600; font-size:14px; cursor:pointer; margin-bottom:20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .form {
    background:var(--paper-2); border:1px solid var(--rule); border-radius:4px; padding:16px;
    margin-bottom:20px; display:none; gap:10px; flex-direction:column;
  }
  .form.open { display:flex; }
  .form input, .form textarea, .form select {
    background:var(--paper); border:1px solid var(--rule); color:var(--text); border-radius:3px;
    padding:9px 10px; font-size:14px; width:100%; font-family:inherit;
  }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .form-actions { display:flex; gap:8px; }
  .btn-primary { background:var(--brass); color:#1b1204; border:none; border-radius:3px; padding:10px 14px; font-weight:600; font-size:13px; cursor:pointer; flex:1; }
  .btn-ghost { background:transparent; border:1px solid var(--rule); color:var(--muted); border-radius:3px; padding:10px 14px; font-weight:600; font-size:13px; cursor:pointer; }
  .err { color:var(--danger); font-size:12.5px; margin:0; }

  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav button { background:none; border:1px solid var(--rule); color:var(--text); border-radius:3px; width:30px; height:30px; font-size:16px; cursor:pointer; }
  .cal-nav h2 { text-transform:capitalize; font-size:16px; margin:0; font-weight:600; font-family:'Fraunces',serif; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--rule); border-left:1px solid var(--rule); margin-bottom:20px; }
  .dow { text-align:center; font-size:10px; color:var(--muted); padding:5px 0; font-weight:600; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .cell {
    min-height:58px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);
    padding:4px 3px; display:flex; flex-direction:column; gap:2px; cursor:pointer;
    font-size:11px; font-weight:600; overflow:hidden; background:var(--paper);
  }
  .cell .daynum { text-align:center; }
  .cell.empty { visibility:hidden; }
  .cell.selected { background:var(--brass-soft); }
  .cell.today .daynum { color:var(--brass); text-decoration:underline; text-underline-offset:2px; }
  .chip { font-size:8.5px; font-weight:600; color:#fff; padding:1px 3px; border-radius:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4; }
  .chip-more { font-size:8px; color:var(--muted); text-align:center; }

  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; }
  .tab { flex:none; background:var(--paper); border:1px solid var(--rule); color:var(--muted); padding:6px 12px; border-radius:3px; font-size:12.5px; cursor:pointer; font-weight:600; }
  .tab.active { color:#1b1204; border-color:var(--brass); background:var(--brass); }

  .day-heading { font-family:'Fraunces',serif; text-transform:capitalize; font-size:15px; margin:0 0 12px; font-weight:600; color:var(--text); border-bottom:1px solid var(--rule); padding-bottom:8px; }

  .statsrow { margin-bottom:16px; }
  .statsrow-label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .statsrow-label b { font-family:'Fraunces',serif; font-weight:600; }
  .statsrow-bar { height:8px; background:var(--paper-2); border:1px solid var(--rule); }
  .statsrow-fill { height:100%; }
  .stats-title { font-family:'Fraunces',serif; font-size:14px; font-weight:600; color:var(--text); margin:22px 0 12px; border-bottom:1px solid var(--rule); padding-bottom:6px; }

  .list { display:flex; flex-direction:column; padding-bottom:12px; }
  .card { border-bottom:1px solid var(--rule); padding:14px 2px; }
  .card:first-child { border-top:1px solid var(--rule); }
  .card-top { display:flex; gap:12px; }
  .avatar {
    width:34px; height:34px; border-radius:3px; flex-shrink:0;
    background:var(--sc,var(--brass)); color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .card-info { flex:1; min-width:0; }
  .card-toprow { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .name { font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; margin:0; }
  .meta { color:var(--muted); font-size:12.5px; margin:1px 0 0; }
  .badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:2px; color:#fff; background:var(--sc,var(--muted)); white-space:nowrap; }
  .notes { color:var(--muted); font-size:13px; margin:10px 0 0; font-style:italic; padding-left:46px; }

  .flags { display:flex; gap:6px; padding-left:46px; margin-top:8px; flex-wrap:wrap; }
  .flag { font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:2px; display:flex; align-items:center; gap:4px; }
  .flag.ok { background:var(--ok-soft); color:var(--ok); }
  .flag.warn { background:var(--warn-soft); color:var(--warn); }

  .actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; padding-left:46px; }
  .action { border-radius:3px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--rule); background:transparent; color:var(--text); display:flex; align-items:center; gap:5px; }
  .action.accept { border-color:var(--ok); color:var(--ok); }
  .action.decline { border-color:var(--danger); color:var(--danger); }
  .action.stripe { border-color:var(--brass); color:var(--brass); }
  .action.copy { color:var(--muted); }
  .action.delete { border-color:var(--rule); color:var(--danger); margin-left:auto; }

  .deposit { margin:10px 0 0 46px; padding-top:8px; border-top:1px dashed var(--rule); font-size:12px; word-break:break-all; color:var(--muted); }

  .empty { color:var(--muted); font-size:13.5px; text-align:center; padding:34px 10px; }
  .empty svg { opacity:.35; margin-bottom:8px; }

  .skeleton { display:grid; gap:2px; }
  .skel-card { height:70px; background:linear-gradient(90deg,var(--paper-2) 25%,var(--rule) 37%,var(--paper-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:0 0} }

  .toasts { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:50; width:calc(100% - 32px); max-width:400px; }
  .toast { background:var(--text); color:var(--paper); padding:11px 16px; border-radius:4px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.3); animation:toastin .2s ease; }
  .toast.error { background:var(--danger); }
  .toast.success { background:var(--ok); }
  @keyframes toastin { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

  .gate { background:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-card { max-width:320px; width:100%; background:var(--paper); border-radius:4px; padding:42px 28px; text-align:center; border-top:3px solid var(--brass); }
  .gate-card .hero-badge { margin:0 auto 16px; width:auto; height:auto; background:none; }
  .gate-card img { width:46px; height:46px; }
  .gate-card p { color:var(--muted); font-size:13.5px; font-family:'Fraunces',serif; font-style:italic; margin:0; }
  .gate-card input { background:var(--paper-2); border:1px solid var(--rule); border-radius:3px; color:var(--text); padding:10px; width:100%; margin:16px 0; text-align:center; font-size:14px; }
</style>

</head>

let quoteEntry = null;

const API = "/api/reservations";

let entries = [];
let loaded = false;
let view = "planning";
let filter = "pending";
let searchTerm = "";
let cursor = new Date();
let selectedDate = isoDate(new Date());

function key() { return localStorage.getItem("dashboardKey") || ""; }
function saveKey() {
  const v = document.getElementById("keyInput").value.trim();
  if (!v) return;
  localStorage.setItem("dashboardKey", v);
  init();
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function formatDate(s) { if(!s) return ""; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }
function initials(name) { return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()).join(""); }

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " "+kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts={}) {
  const res = await fetch(API+path, { ...opts, headers: { "Content-Type":"application/json", "x-dashboard-key": key(), ...(opts.headers||{}) } });
  if (res.status === 401) { localStorage.removeItem("dashboardKey"); init(); throw new Error("Clé du dashboard incorrecte."); }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) {
    throw new Error(`Réponse inattendue du serveur (code ${res.status}). Détail : ${text.slice(0,200)}`);
  }
  if (!res.ok) throw new Error(data.error ? JSON.stringify(data) : `Erreur ${res.status}`);
  return data;
}

async function init() {
  if (!key()) { document.getElementById("gate").style.display="block"; document.getElementById("app").style.display="none"; return; }
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  loaded = false;
  render();
  try {
    entries = await api("");
  } catch(e) {
    entries = [];
    toast("Erreur de chargement : " + e.message, "error");
  }
  loaded = true;
  render();
  syncPrivateaser(true);
}

function setView(v) {
  view = v;
  document.getElementById("tab-planning").classList.toggle("active", v==="planning");
  document.getElementById("tab-list").classList.toggle("active", v==="list");
  document.getElementById("tab-stats").classList.toggle("active", v==="stats");
  document.getElementById("planningView").style.display = v==="planning" ? "block" : "none";
  document.getElementById("listView").style.display = v==="list" ? "block" : "none";
  document.getElementById("statsView").style.display = v==="stats" ? "block" : "none";
  render();
}

function toggleForm() {
  const f = document.getElementById("form");
  f.classList.toggle("open");
  document.getElementById("f-err").textContent = "";
}

async function submitForm() {
  const name = document.getElementById("f-name").value.trim();
  const date = document.getElementById("f-date").value;
  if (!name) { document.getElementById("f-err").textContent = "Le nom du client est obligatoire."; return; }
  if (!date) { document.getElementById("f-err").textContent = "La date est obligatoire."; return; }
  const body = {
    name, date,
    contact: document.getElementById("f-contact").value,
    time: document.getElementById("f-time").value,
    guests: document.getElementById("f-guests").value,
    notes: document.getElementById("f-notes").value,
    source: document.getElementById("f-source").value,
    manual: true
  };
  try {
    await api("", { method:"POST", body: JSON.stringify(body) });
    ["f-name","f-contact","f-time","f-guests","f-notes"].forEach(id => document.getElementById(id).value="");
    document.getElementById("f-date").value="";
    document.getElementById("f-source").value="Manuel";
    document.getElementById("form").classList.remove("open");
    selectedDate = date;
    entries = await api("");
    toast("Demande ajoutée.", "success");
    render();
  } catch (e) {
    document.getElementById("f-err").textContent = e.message;
  }
}

async function setStatus(id, status) {
  try {
    const res = await api("/"+id, { method:"PATCH", body: JSON.stringify({status}) });
    if (res.stripeError) toast("Statut mis à jour, mais la génération du lien Stripe a échoué : " + res.stripeError, "error");
    else if (status === "accepted" && res.entry.depositLink) toast("Accepté — lien de caution généré" + (res.entry.emailSent ? " et envoyé par email." : "."), "success");
    else toast("Statut mis à jour.");
    entries = await api("");
    render();
  } catch (e) {
    toast(e.message, "error");
  }
}

async function makeStripeLink(id, name) {
  const amount = prompt(`Montant de la caution pour ${name} (en euros) :`);
  if (!amount) return;
  try {
    const res = await api(`/${id}/deposit-link`, { method:"POST", body: JSON.stringify({amount: Number(amount)}) });
    toast("Lien généré" + (res.emailResult && res.emailResult.sent ? " et envoyé par email." : "."), "success");
    entries = await api("");
    render();
  } catch (e) {
    toast(e.message, "error");
  }
}

async function syncPrivateaser(silent, reset) {
  try {
    const res = await fetch("/api/sync-privateaser", { method: "POST", headers: { "x-dashboard-key": key(), "Content-Type": "application/json" }, body: JSON.stringify({ reset: !!reset }) }).then(r => r.json());
    if (res.error) throw new Error(res.error);
    if (!silent || res.created > 0 || res.removed > 0) {
      const removedTxt = res.removed ? `${res.removed} doublon(s) supprimé(s), ` : "";
      toast(`${removedTxt}${res.created} nouvelle(s) réservation(s) importée(s), ${res.skipped} déjà à jour.`, "success");
    }
    if (res.created > 0 || res.removed > 0) {
      entries = await api("");
      render();
    }
  } catch (e) {
    if (!silent) toast(e.message, "error");
  }
}

async function deleteEntry(id, name) {
  if (!confirm(`Supprimer définitivement la réservation de ${name} ? Cette action est irréversible.`)) return;
  try {
    await api("/"+id, { method:"DELETE" });
    toast("Réservation supprimée.", "success");
    entries = await api("");
    render();
  } catch (e) {
    toast(e.message, "error");
  }
}

function openQuote(entry) {
  quoteEntry = entry;
  quoteQty = {};
  document.getElementById("quoteTitle").textContent = `Devis — ${entry.name}`;
  document.getElementById("quote-err").textContent = "";
  renderQuoteBody();
  document.getElementById("quotePanel").style.display = "block";
}

function closeQuote() {
  document.getElementById("quotePanel").style.display = "none";
  quoteEntry = null;
}

function changeQty(name, delta) {
  const next = (quoteQty[name] || 0) + delta;
  quoteQty[name] = Math.max(0, next);
  renderQuoteBody();
}

function renderQuoteBody() {
  let total = 0;
  const html = MENU.map(group => `
    <div style="margin-bottom:14px;">
      <div style="font-family:'Fraunces',serif; font-weight:600; font-size:13px; margin-bottom:6px; color:var(--muted)">${group.cat}</div>
      ${group.items.map(item => {
        const qty = quoteQty[item.n] || 0;
        total += qty * item.p;
        return `<div style="display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--rule); gap:8px;">
          <div style="flex:1; font-size:13px;">${item.n} <span style="color:var(--muted)">— ${item.p.toFixed(2)}€</span></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <button onclick="changeQty('${item.n.replace(/'/g,"\\'")}',-1)" style="width:24px;height:24px;border-radius:3px;border:1px solid var(--rule);background:none;cursor:pointer">−</button>
            <span style="min-width:14px;text-align:center;font-weight:600">${qty}</span>
            <button onclick="changeQty('${item.n.replace(/'/g,"\\'")}',1)" style="width:24px;height:24px;border-radius:3px;border:1px solid var(--rule);background:none;cursor:pointer">+</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  `).join("");
  document.getElementById("quoteBody").innerHTML = html;
  document.getElementById("quoteTotal").textContent = total.toFixed(2).replace(".", ",") + " €";
}

async function sendQuote() {
  const lines = [];
  let total = 0;
  MENU.forEach(group => group.items.forEach(item => {
    const qty = quoteQty[item.n] || 0;
    if (qty > 0) { lines.push({ name: item.n, price: item.p, qty }); total += qty * item.p; }
  }));
  if (lines.length === 0) { document.getElementById("quote-err").textContent = "Ajoute au moins un article."; return; }
  if (!quoteEntry.email) { document.getElementById("quote-err").textContent = "Ce client n'a pas d'email enregistré — impossible d'envoyer le devis."; return; }

  const btn = document.getElementById("quoteSendBtn");
  btn.disabled = true; btn.textContent = "Génération...";

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont("helvetica", "bold"); doc.setFontSize(18);
    doc.setTextColor(255, 110, 0); doc.text("YONKO BAR", 20, 22);
    doc.setTextColor(30, 30, 30); doc.setFontSize(12); doc.setFont("helvetica", "normal");
    doc.text(`Devis pour ${quoteEntry.name}`, 20, 34);
    doc.setFontSize(10); doc.setTextColor(120, 120, 120);
    doc.text(`Réservation du ${quoteEntry.date}${quoteEntry.time ? " à " + quoteEntry.time : ""}`, 20, 41);
    let y = 55;
    doc.setDrawColor(220, 220, 220); doc.line(20, y, 190, y); y += 8;
    doc.setTextColor(30, 30, 30); doc.setFontSize(11);
    lines.forEach(l => {
      doc.text(`${l.qty} × ${l.name}`, 20, y);
      doc.text(`${(l.qty * l.price).toFixed(2)} €`, 170, y, { align: "right" });
      y += 8;
      if (y > 270) { doc.addPage(); y = 20; }
    });
    y += 4; doc.line(20, y, 190, y); y += 10;
    doc.setFont("helvetica", "bold"); doc.setFontSize(13);
    doc.text("Total", 20, y);
    doc.text(`${total.toFixed(2)} €`, 170, y, { align: "right" });

    const pdfBase64 = doc.output("datauristring").split(",")[1];

    const res = await fetch(`/api/reservations/${quoteEntry.id}/send-quote`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-key": key() },
      body: JSON.stringify({ pdfBase64, total, lines }),
    }).then(r => r.json());

    if (res.error) throw new Error(res.error);
    toast("Devis envoyé par email.", "success");
    closeQuote();
  } catch (e) {
    document.getElementById("quote-err").textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Générer et envoyer par email";
  }
}

function copyMessage(entry) {
  const lines = [
    `Bonjour ${entry.name},`, "",
    `Votre réservation au Yonko Bar est confirmée pour ${formatDate(entry.date)} à ${entry.time||"l'heure demandée"}, pour ${entry.guests||"?"} personne(s).`,
  ];
  if (entry.depositLink) { lines.push("", `Pour finaliser, merci de valider votre caution ici : ${entry.depositLink}`); }
  lines.push("", "À bientôt, l'équipe du Yonko Bar.");
  navigator.clipboard.writeText(lines.join("\n"));
  toast("Message copié dans le presse-papiers.", "success");
}

function cardHTML(e) {
  const sc = STATUS[e.status].color;
  const flags = [];
  if (e.status === "accepted" && e.depositLink) {
    flags.push(`<span class="flag ${e.emailSent?'ok':'warn'}">${ICONS.mail} ${e.emailSent?"Email envoyé":"Email non envoyé"}</span>`);
    flags.push(`<span class="flag ${e.depositStatus==='autorisee'?'ok':'warn'}">${ICONS.card} ${e.depositStatus==='autorisee'?"Caution validée":"En attente du client"}</span>`);
  }
  return `<div class="card">
    <div class="card-top">
      <div class="avatar" style="--sc:${sc}">${initials(e.name)}</div>
      <div class="card-info">
        <div class="card-toprow">
          <div>
            <p class="name">${e.name}</p>
            <p class="meta">${formatDate(e.date)}${e.time?" · "+e.time:""}${e.guests?" · "+e.guests+" pers.":""}${e.source?" · "+e.source:""}</p>
            ${e.contact?`<p class="meta">${e.contact}</p>`:""}
          </div>
          <span class="badge" style="--sc:${sc}">${STATUS[e.status].label}</span>
        </div>
      </div>
    </div>
    ${e.notes?`<p class="notes">${e.notes}</p>`:""}
    ${flags.length?`<div class="flags">${flags.join("")}</div>`:""}
    <div class="actions">
      ${e.status!=="accepted"?`<button class="action accept" onclick="setStatus('${e.id}','accepted')">${ICONS.check} Accepter</button>`:""}
      ${e.status!=="declined"?`<button class="action decline" onclick="setStatus('${e.id}','declined')">${ICONS.x} Refuser</button>`:""}
      ${e.status!=="pending"?`<button class="action" onclick="setStatus('${e.id}','pending')">${ICONS.undo} En attente</button>`:""}
      ${e.status==="accepted"?`<button class="action stripe" onclick="makeStripeLink('${e.id}','${e.name}')">${ICONS.link} ${e.depositLink?"Régénérer":"Lien Stripe"}</button>`:""}
      ${e.status==="accepted"?`<button class="action copy" onclick='copyMessage(${JSON.stringify(e)})'>${ICONS.copy} Copier</button>`:""}
      <button class="action" onclick='openQuote(${JSON.stringify(e)})'>${ICONS.card} Devis</button>
      <button class="action delete" onclick="deleteEntry('${e.id}','${e.name}')">${ICONS.trash} Supprimer</button>
    </div>
    ${e.depositLink?`<div class="deposit">${e.depositAmount?e.depositAmount+"€ — ":""}${e.depositLink}</div>`:""}
  </div>`;
}

function renderStats(counts) {
  document.getElementById("stats").innerHTML = `
    <div class="stat pending" onclick="filter='pending';setView('list')"><span class="n">${counts.pending||0}</span><span class="l">En attente</span></div>
    <div class="stat accepted" onclick="filter='accepted';setView('list')"><span class="n">${counts.accepted||0}</span><span class="l">Acceptées</span></div>
    <div class="stat declined" onclick="filter='declined';setView('list')"><span class="n">${counts.declined||0}</span><span class="l">Refusées</span></div>
  `;
}

function matchesSearch(e) {
  if (!searchTerm.trim()) return true;
  return (e.name||"").toLowerCase().includes(searchTerm.trim().toLowerCase());
}

function emptyState(msg) {
  return `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/></svg><div>${msg}</div></div>`;
}

function skeleton() {
  return `<div class="skeleton"><div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div></div>`;
}

function renderList() {
  const counts = {pending:0,accepted:0,declined:0};
  entries.forEach(e => counts[e.status] = (counts[e.status]||0)+1);
  renderStats(counts);
  if (!loaded) { document.getElementById("listView").innerHTML = skeleton(); return; }
  const tabs = [["pending","En attente"],["accepted","Acceptées"],["declined","Refusées"],["all","Toutes"]]
    .map(([k,l]) => `<button class="tab ${filter===k?'active':''}" onclick="filter='${k}';render()">${l} ${k!=='all'?`(${counts[k]||0})`:""}</button>`).join("");
  const visible = entries.filter(e => (filter==="all"||e.status===filter) && matchesSearch(e))
    .sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
  document.getElementById("listView").innerHTML = `<div class="tabs">${tabs}</div>` +
    (visible.length ? `<div class="list">${visible.map(cardHTML).join("")}</div>` : emptyState("Aucune demande dans cette catégorie."));
}

function renderPlanning() {
  const counts = {pending:0,accepted:0,declined:0};
  entries.forEach(e => counts[e.status] = (counts[e.status]||0)+1);
  renderStats(counts);
  if (!loaded) { document.getElementById("planningView").innerHTML = skeleton(); return; }

  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y,m,1);
  const offset = (first.getDay()+6)%7;
  const days = new Date(y,m+1,0).getDate();
  const byDate = {};
  entries.forEach(e => { if(e.date && matchesSearch(e)) (byDate[e.date]=byDate[e.date]||[]).push(e); });

  let cells = "";
  for (let i=0;i<offset;i++) cells += `<div class="cell empty"></div>`;
  const todayIso = isoDate(new Date());
  for (let d=1; d<=days; d++) {
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayEn = byDate[iso]||[];
    const chips = dayEn.slice(0,2).map(e => `<span class="chip" style="background:${STATUS[e.status].color}">${(e.name||"").split(" ")[0]}</span>`).join("");
    const more = dayEn.length > 2 ? `<span class="chip-more">+${dayEn.length-2}</span>` : "";
    cells += `<div class="cell ${iso===selectedDate?"selected":""} ${iso===todayIso?"today":""}" onclick="selectedDate='${iso}';render()"><span class="daynum">${d}</span>${chips}${more}</div>`;
  }

  const label = first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const term = searchTerm.trim();
  let heading, resultEntries;
  if (term) {
    resultEntries = entries.filter(matchesSearch).sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
    heading = `Résultats pour "${term}"`;
  } else {
    resultEntries = (byDate[selectedDate]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    heading = formatDate(selectedDate) || "Jour sélectionné";
  }

  document.getElementById("planningView").innerHTML = `
    <div class="cal-nav"><button onclick="cursor=new Date(${y},${m-1},1);render()">‹</button><h2>${label}</h2><button onclick="cursor=new Date(${y},${m+1},1);render()">›</button></div>
    <div class="cal-grid">${WEEKDAYS.map(w=>`<div class="dow">${w}</div>`).join("")}${cells}</div>
    <h3 class="day-heading">${heading}</h3>
    ${resultEntries.length ? `<div class="list">${resultEntries.map(cardHTML).join("")}</div>` : emptyState(term ? "Aucune réservation trouvée." : "Aucune réservation ce jour-là.")}
  `;
}

const SOURCE_COLORS = { "Site internet":"#ff6e00", "Privateaser":"#2fa88f", "Google":"#4285f4", "Manuel":"#78726a" };

function statsRow(label, count, max, color) {
  const pct = max ? Math.round((count/max)*100) : 0;
  return `<div class="statsrow">
    <div class="statsrow-label"><span>${label}</span><b>${count}</b></div>
    <div class="statsrow-bar"><div class="statsrow-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function renderStatsView() {
  if (!loaded) { document.getElementById("statsView").innerHTML = skeleton(); return; }
  const bySource = {};
  entries.forEach(e => { const s = e.source || "Manuel"; bySource[s] = (bySource[s]||0)+1; });
  const sourceEntries = Object.entries(bySource).sort((a,b)=>b[1]-a[1]);
  const maxSource = Math.max(1, ...sourceEntries.map(([,c])=>c));

  const total = entries.length;
  const accepted = entries.filter(e=>e.status==="accepted").length;
  const withDeposit = entries.filter(e=>e.depositLink).length;
  const validated = entries.filter(e=>e.depositStatus==="autorisee").length;

  document.getElementById("statsView").innerHTML = `
    <div class="stats-title">Provenance des réservations (${total} au total)</div>
    ${sourceEntries.length ? sourceEntries.map(([s,c]) => statsRow(s, c, maxSource, SOURCE_COLORS[s]||"#78726a")).join("") : emptyState("Pas encore de données.")}
    <div class="stats-title">Cautions</div>
    ${statsRow("Réservations acceptées", accepted, total||1, "#2fa88f")}
    ${statsRow("Liens de caution générés", withDeposit, total||1, "#ff6e00")}
    ${statsRow("Cautions validées par le client", validated, total||1, "#c98f1c")}
  `;
}

function render() { if (view==="planning") renderPlanning(); else if (view==="stats") renderStatsView(); else renderList(); }

init();
</script>
