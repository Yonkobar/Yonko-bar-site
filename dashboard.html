<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal des réservations — Yonko Bar</title>
<style>
  :root {
    --ink:#ffffff; --panel:#f7f5f2; --panel-2:#efebe4; --line:#e2ded6;
    --orange:#ff6e00; --teal:#2fa88f; --amber:#c98f1c; --red:#c4483a;
    --text:#1a1a1a; --muted:#6b6b6b;
  }
  * { box-sizing: border-box; }
  body { background:var(--ink); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:20px 16px 40px; max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; }
  h1 span { color:var(--orange); }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .viewtoggle { display:flex; gap:6px; margin-bottom:14px; }
  .viewtoggle button { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:9px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; }
  .viewtoggle button.active { color:#fff; background:var(--orange); border-color:var(--orange); }
  .addbtn { width:100%; background:var(--orange); color:#fff; border:none; border-radius:8px; padding:11px; font-weight:600; font-size:14px; cursor:pointer; margin-bottom:18px; }
  .form { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:18px; display:none; gap:9px; flex-direction:column; }
  .form.open { display:flex; }
  .form input, .form textarea { background:var(--ink); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 9px; font-size:14px; width:100%; font-family:inherit; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .form-actions { display:flex; gap:8px; }
  .btn-primary { background:var(--orange); color:#fff; border:none; border-radius:6px; padding:9px 14px; font-weight:600; font-size:13px; cursor:pointer; flex:1; }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:9px 14px; font-weight:600; font-size:13px; cursor:pointer; }
  .err { color:var(--red); font-size:12.5px; margin:0; }
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-nav button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; width:32px; height:32px; font-size:16px; cursor:pointer; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:18px; }
  .dow { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
  .cell { aspect-ratio:1; border-radius:7px; border:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; font-size:12px; }
  .cell.empty { visibility:hidden; }
  .cell.selected { border-color:var(--orange); background:rgba(255,110,0,.14); }
  .dots { display:flex; gap:2px; }
  .dot { width:5px; height:5px; border-radius:50%; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; }
  .tab { flex:none; background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:7px 12px; border-radius:7px; font-size:13px; cursor:pointer; }
  .tab.active { color:var(--text); border-color:var(--orange); background:rgba(255,110,0,.12); }
  .list { display:grid; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--sc,var(--line)); border-radius:9px; padding:13px 14px; }
  .card-top { display:flex; justify-content:space-between; gap:10px; }
  .name { font-weight:600; font-size:15px; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:13px; margin:0; }
  .badge { font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; color:#fff; background:var(--sc,var(--muted)); white-space:nowrap; height:fit-content; }
  .notes { color:var(--muted); font-size:13px; margin:8px 0 0; font-style:italic; }
  .actions { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
  .action { border-radius:6px; padding:7px 11px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--ink); color:var(--text); }
  .action.accept { border-color:var(--teal); color:var(--teal); }
  .action.decline { border-color:var(--red); color:var(--red); }
  .action.copy, .action.stripe { border-color:var(--orange); color:var(--orange); }
  .deposit { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13px; word-break:break-all; color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; text-align:center; padding:40px 10px; border:1px dashed var(--line); border-radius:10px; }
  .toast { font-size:12px; color:var(--teal); margin-top:6px; }
  .gate { padding:40px 20px; text-align:center; }
  .gate input { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px; width:100%; margin:10px 0; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <p>Clé du dashboard :</p>
  <input id="keyInput" type="password" placeholder="Colle ta clé ici">
  <button class="btn-primary" onclick="saveKey()">Valider</button>
</div>

<div id="app" style="display:none">
  <h1>Journal des <span>réservations</span></h1>
  <p class="sub">Yonko Bar — demandes reçues depuis le site</p>

  <div class="viewtoggle">
    <button id="tab-planning" class="active" onclick="setView('planning')">Planning</button>
    <button id="tab-list" onclick="setView('list')">Liste</button>
  </div>

  <button class="addbtn" onclick="toggleForm()">+ Nouvelle demande</button>

  <div class="form" id="form">
    <div class="row2">
      <input id="f-name" placeholder="Nom du client">
      <input id="f-contact" placeholder="Téléphone ou email">
    </div>
    <div class="row2">
      <input id="f-date" type="date">
      <input id="f-time" type="time">
    </div>
    <input id="f-guests" placeholder="Nombre de personnes">
    <textarea id="f-notes" rows="2" placeholder="Notes"></textarea>
    <p class="err" id="f-err"></p>
    <div class="form-actions">
      <button class="btn-primary" onclick="submitForm()">Ajouter la demande</button>
      <button class="btn-ghost" onclick="toggleForm()">Annuler</button>
    </div>
  </div>

  <div id="planningView"></div>
  <div id="listView" style="display:none"></div>
</div>

<script>
const API = "/api/reservations";
const STATUS = { pending:{label:"En attente",color:"#E8B54D"}, accepted:{label:"Acceptée",color:"#2FA88F"}, declined:{label:"Refusée",color:"#C4483A"} };
const WEEKDAYS = ["L","M","M","J","V","S","D"];
let entries = [];
let view = "planning";
let filter = "pending";
let cursor = new Date();
let selectedDate = isoDate(new Date());

function key() { return localStorage.getItem("dashboardKey") || ""; }
function saveKey() {
  const v = document.getElementById("keyInput").value.trim();
  if (!v) return;
  localStorage.setItem("dashboardKey", v);
  init();
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function formatDate(s) { if(!s) return ""; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }

async function api(path, opts={}) {
  const res = await fetch(API+path, { ...opts, headers: { "Content-Type":"application/json", "x-dashboard-key": key(), ...(opts.headers||{}) } });
  if (res.status === 401) { localStorage.removeItem("dashboardKey"); init(); throw new Error("Clé du dashboard incorrecte."); }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) {
    throw new Error(`Réponse inattendue du serveur (code ${res.status}). Détail : ${text.slice(0,200)}`);
  }
  if (!res.ok) throw new Error(data.error ? JSON.stringify(data) : `Erreur ${res.status}`);
  return data;
}

async function init() {
  if (!key()) { document.getElementById("gate").style.display="block"; document.getElementById("app").style.display="none"; return; }
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  try {
    entries = await api("");
  } catch(e) {
    entries = [];
    alert("Erreur de chargement : " + e.message);
  }
  render();
}

function setView(v) {
  view = v;
  document.getElementById("tab-planning").classList.toggle("active", v==="planning");
  document.getElementById("tab-list").classList.toggle("active", v==="list");
  document.getElementById("planningView").style.display = v==="planning" ? "block" : "none";
  document.getElementById("listView").style.display = v==="list" ? "block" : "none";
  render();
}

function toggleForm() {
  const f = document.getElementById("form");
  f.classList.toggle("open");
  document.getElementById("f-err").textContent = "";
}

async function submitForm() {
  const name = document.getElementById("f-name").value.trim();
  const date = document.getElementById("f-date").value;
  if (!name) { document.getElementById("f-err").textContent = "Le nom du client est obligatoire."; return; }
  if (!date) { document.getElementById("f-err").textContent = "La date est obligatoire."; return; }
  const body = {
    name, date,
    contact: document.getElementById("f-contact").value,
    time: document.getElementById("f-time").value,
    guests: document.getElementById("f-guests").value,
    notes: document.getElementById("f-notes").value,
  };
  try {
    await api("", { method:"POST", body: JSON.stringify(body) });
    ["f-name","f-contact","f-time","f-guests","f-notes"].forEach(id => document.getElementById(id).value="");
    document.getElementById("f-date").value="";
    document.getElementById("form").classList.remove("open");
    selectedDate = date;
    entries = await api("");
    render();
  } catch (e) {
    document.getElementById("f-err").textContent = e.message;
  }
}

async function setStatus(id, status) {
  try {
    await api("/"+id, { method:"PATCH", body: JSON.stringify({status}) });
    entries = await api("");
    render();
  } catch (e) {
    alert(e.message);
  }
}

async function makeStripeLink(id, name) {
  const amount = prompt(`Montant de la caution pour ${name} (en euros) :`);
  if (!amount) return;
  try {
    const res = await api(`/${id}/deposit-link`, { method:"POST", body: JSON.stringify({amount: Number(amount)}) });
    entries = await api("");
    render();
  } catch (e) {
    alert(e.message);
  }
}

function copyMessage(entry) {
  const lines = [
    `Bonjour ${entry.name},`, "",
    `Votre réservation au Yonko Bar est confirmée pour ${formatDate(entry.date)} à ${entry.time||"l'heure demandée"}, pour ${entry.guests||"?"} personne(s).`,
  ];
  if (entry.depositLink) { lines.push("", `Pour finaliser, merci de valider votre caution ici : ${entry.depositLink}`); }
  lines.push("", "À bientôt, l'équipe du Yonko Bar.");
  navigator.clipboard.writeText(lines.join("\n"));
  alert("Message copié !");
}

function cardHTML(e) {
  const sc = STATUS[e.status].color;
  return `<div class="card" style="--sc:${sc}">
    <div class="card-top">
      <div>
        <p class="name">${e.name}</p>
        <p class="meta">${formatDate(e.date)}${e.time?" · "+e.time:""}${e.guests?" · "+e.guests+" pers.":""}</p>
        ${e.contact?`<p class="meta">${e.contact}</p>`:""}
      </div>
      <span class="badge" style="--sc:${sc}">${STATUS[e.status].label}</span>
    </div>
    ${e.notes?`<p class="notes">${e.notes}</p>`:""}
    <div class="actions">
      ${e.status!=="accepted"?`<button class="action accept" onclick="setStatus('${e.id}','accepted')">Accepter</button>`:""}
      ${e.status!=="declined"?`<button class="action decline" onclick="setStatus('${e.id}','declined')">Refuser</button>`:""}
      ${e.status!=="pending"?`<button class="action" onclick="setStatus('${e.id}','pending')">Remettre en attente</button>`:""}
      ${e.status==="accepted"?`<button class="action stripe" onclick="makeStripeLink('${e.id}','${e.name}')">${e.depositLink?"Régénérer le lien Stripe":"Générer le lien Stripe"}</button>`:""}
      ${e.status==="accepted"?`<button class="action copy" onclick='copyMessage(${JSON.stringify(e)})'>Copier le message</button>`:""}
    </div>
    ${e.depositLink?`<div class="deposit">${e.depositLink}</div>`:""}
  </div>`;
}

function renderList() {
  const counts = {pending:0,accepted:0,declined:0};
  entries.forEach(e => counts[e.status] = (counts[e.status]||0)+1);
  const tabs = [["pending","En attente"],["accepted","Acceptées"],["declined","Refusées"],["all","Toutes"]]
    .map(([k,l]) => `<button class="tab ${filter===k?'active':''}" onclick="filter='${k}';render()">${l}${k!=='all'?` <b>${counts[k]||0}</b>`:""}</button>`).join("");
  const visible = entries.filter(e => filter==="all"||e.status===filter)
    .sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
  document.getElementById("listView").innerHTML = `<div class="tabs">${tabs}</div>` +
    (visible.length ? `<div class="list">${visible.map(cardHTML).join("")}</div>` : `<div class="empty">Aucune demande dans cette catégorie.</div>`);
}

function renderPlanning() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y,m,1);
  const offset = (first.getDay()+6)%7;
  const days = new Date(y,m+1,0).getDate();
  const byDate = {};
  entries.forEach(e => { if(e.date) (byDate[e.date]=byDate[e.date]||[]).push(e); });

  let cells = "";
  for (let i=0;i<offset;i++) cells += `<div class="cell empty"></div>`;
  for (let d=1; d<=days; d++) {
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayEn = byDate[iso]||[];
    const dots = dayEn.slice(0,4).map(e => `<span class="dot" style="background:${STATUS[e.status].color}"></span>`).join("");
    cells += `<div class="cell ${iso===selectedDate?"selected":""}" onclick="selectedDate='${iso}';render()"><span>${d}</span><div class="dots">${dots}</div></div>`;
  }

  const label = first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const dayEntries = (byDate[selectedDate]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));

  document.getElementById("planningView").innerHTML = `
    <div class="cal-nav"><button onclick="cursor=new Date(${y},${m-1},1);render()">‹</button><h2 style="text-transform:capitalize;font-size:15px;margin:0">${label}</h2><button onclick="cursor=new Date(${y},${m+1},1);render()">›</button></div>
    <div class="cal-grid">${WEEKDAYS.map(w=>`<div class="dow">${w}</div>`).join("")}${cells}</div>
    <h3 style="text-transform:capitalize;font-size:14px;margin:0 0 10px">${formatDate(selectedDate)||"Jour sélectionné"}</h3>
    ${dayEntries.length ? `<div class="list">${dayEntries.map(cardHTML).join("")}</div>` : `<div class="empty">Aucune réservation ce jour-là.</div>`}
  `;
}

function render() { if (view==="planning") renderPlanning(); else renderList(); }

init();
</script>
</body>
</html>
